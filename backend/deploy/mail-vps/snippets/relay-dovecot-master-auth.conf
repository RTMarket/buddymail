# Postfix submission 经 Dovecot 做 SASL（与 smtpd_sasl_type=dovecot 配套）
service auth {
  unix_listener /var/spool/postfix/private/auth {
    mode = 0660
    user = postfix
    group = postfix
  }
  unix_listener auth-userdb {
    mode = 0600
    user = postfix
    group = postfix
  }
}

service auth-worker {
  user = postfix
}
